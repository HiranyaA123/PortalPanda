<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CentralPass builds custom restaurant and cafe websites, online ordering, CRM, bookings, kitchen and staff software for independent Australian venues."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#F4F1EA" />
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="https://www.centralpass.au/" />
    <!-- Google crawls /favicon.ico by default and does not reliably pick up an
         SVG-only favicon, which is why search results showed a generic globe.
         The .ico and PNG entries give it a raster it will definitely accept. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/centralpass-mark-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/centralpass-mark-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CentralPass" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:title" content="Restaurant Website, CRM &amp; Venue Software | CentralPass" />
    <meta property="og:description" content="Custom restaurant websites, online ordering, CRM, bookings, kitchen and staff software built for independent Australian venues." />
    <meta property="og:url" content="https://www.centralpass.au/" />
    <meta property="og:image" content="https://www.centralpass.au/centralpass-og-saas.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CentralPass custom venue software for independent restaurants and cafes." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Restaurant Website, CRM &amp; Venue Software | CentralPass" />
    <meta name="twitter:description" content="Custom restaurant websites, online ordering, CRM, bookings, kitchen and staff software built for independent Australian venues." />
    <meta name="twitter:image" content="https://www.centralpass.au/centralpass-og-saas.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Restaurant Website, CRM &amp; Venue Software | CentralPass</title>
    <!-- Organization schema: tells Google which image is the brand logo and
         ties the name, site and contact details into one entity. Every value
         here is a real, verifiable detail — no ratings or review markup. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.centralpass.au/#organization",
        "name": "CentralPass",
        "url": "https://www.centralpass.au/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://www.centralpass.au/centralpass-mark-512.png",
          "width": 512,
          "height": 512
        },
        "image": "https://www.centralpass.au/centralpass-og-saas.png",
        "description": "CentralPass builds custom restaurant and cafe websites, online ordering, CRM, bookings, kitchen and staff software for independent Australian venues.",
        "email": "centralpassinfo@gmail.com",
        "telephone": "+61452145196",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Adelaide",
          "addressRegion": "SA",
          "addressCountry": "AU"
        },
        "areaServed": {
          "@type": "AdministrativeArea",
          "name": "Australia"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "email": "centralpassinfo@gmail.com",
          "telephone": "+61452145196",
          "areaServed": "AU",
          "availableLanguage": "English"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
